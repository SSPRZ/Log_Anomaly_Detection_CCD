# Stateful operators (sync wave -1 so CRDs exist before the platform chart).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source: { repoURL: https://strimzi.io/charts/, chart: strimzi-kafka-operator, targetRevision: 0.45.0,
            helm: { values: "watchAnyNamespace: true" } }
  destination: { server: https://kubernetes.default.svc, namespace: kafka }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [ CreateNamespace=true, ServerSideApply=true ] }
---
