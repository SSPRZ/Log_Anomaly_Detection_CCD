{{- range $name, $j := .Values.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lap-{{ $name | lower }}
  labels: {{- include "lap.labels" $ | nindent 4 }}
spec:
  schedule: {{ $j.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app.kubernetes.io/name: lap-{{ $name | lower }} }
        spec:
          restartPolicy: Never
          serviceAccountName: lap
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: job
              image: {{ include "lap.image" $ }}
              args: {{ toJson $j.args }}
              env: {{- include "lap.env" $ | nindent 16 }}
              resources: { requests: { cpu: "2", memory: 6Gi }, limits: { memory: 8Gi } }
              volumeMounts: [ { name: models, mountPath: /models }, { name: tmp, mountPath: /tmp } ]
          volumes:
            - { name: models, persistentVolumeClaim: { claimName: lap-models } }
            - { name: tmp, emptyDir: {} }
{{- end }}
