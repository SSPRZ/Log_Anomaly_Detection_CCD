# Pipeline SLOs (Section 6). These alerts are about the platform itself and are routed
# separately from application anomaly alerts (receiver "pipeline" in Alertmanager).
groups:
  - name: lap-pipeline-slo
    rules:
      - record: lap:e2e_latency_seconds:p95_1h
        expr: histogram_quantile(0.95, sum by (le) (rate(lap_e2e_latency_seconds_bucket[1h])))

      - alert: LapLatencySLOBreach
        expr: lap:e2e_latency_seconds:p95_1h > 60
        for: 10m
        labels: { severity: P2, team: platform, pipeline: "true" }
        annotations: { summary: "p95 log->score latency {{ $value | humanizeDuration }} (SLO < 60 s)" }

      - alert: LapConsumerLagGrowing
        expr: deriv(lap_consumer_lag[5m]) > 0 and lap_consumer_lag > 1000
        for: 5m
        labels: { severity: P2, team: platform, pipeline: "true" }
        annotations: { summary: "Consumer group {{ $labels.group }} lag is growing ({{ $value }})" }

      - alert: LapDLQRateHigh
        expr: sum(rate(lap_dlq_total[10m])) / clamp_min(sum(rate(lap_records_in_total{stage="parse-enrich"}[10m])), 1) > 0.001
        for: 10m
        labels: { severity: P3, team: platform, pipeline: "true" }
        annotations: { summary: "DLQ rate above 0.1% of ingested records" }

      - alert: LapStoreInsertErrors
        expr: increase(lap_store_insert_errors_total[10m]) > 0
        for: 10m
        labels: { severity: P2, team: platform, pipeline: "true" }
        annotations: { summary: "Sustained ClickHouse insert errors" }

      - alert: LapCanaryDeadMansSwitch
        expr: time() - max(lap_canary_last_score_ts) > 180   # only the scorer sets it; other stages export 0
        for: 1m
        labels: { severity: P1, team: platform, pipeline: "true" }
        annotations: { summary: "No canary score for > 3 min -- the detection pipeline is not delivering" }

      - alert: LapFeatureDrift
        expr: max(lap_feature_psi) > 0.2
        for: 30m
        labels: { severity: P3, team: ml, pipeline: "true" }
        annotations: { summary: "PSI > 0.2 on {{ $labels.feature }} -- open a model review ticket" }
