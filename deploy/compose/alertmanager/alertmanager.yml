# Alertmanager: silences, inhibition and maintenance windows in front of Slack / e-mail / PagerDuty.
# Fill the receivers' secrets via environment-specific config (External Secrets in Kubernetes).
route:
  receiver: slack-default
  group_by: [ incident_id, service ]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: [ 'pipeline="true"' ]
      receiver: slack-pipeline
    - matchers: [ 'severity="P1"' ]
      receiver: pagerduty
      continue: true
    - matchers: [ 'severity=~"P1|P2"' ]
      receiver: slack-default
    - matchers: [ 'severity="P3"' ]
      receiver: blackhole            # dashboard only

inhibit_rules:
  # a P1 for a service suppresses its P2/P3 noise
  - source_matchers: [ 'severity="P1"' ]
    target_matchers: [ 'severity=~"P2|P3"' ]
    equal: [ service ]
  # a dead pipeline makes "no anomaly" meaningless; mute application alerts while it is down
  - source_matchers: [ 'alertname="LapCanaryDeadMansSwitch"' ]
    target_matchers: [ 'alertname="LogAnomaly"' ]

receivers:
  - name: blackhole
  - name: slack-default
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE/ME'
        channel: '#alerts'
        send_resolved: true
        title: '{{ .CommonLabels.severity }} {{ .CommonLabels.service }} anomaly'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.drivers }}{{ "\n" }}{{ .Annotations.logs_url }}{{ "\n" }}{{ end }}'
  - name: slack-pipeline
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE/ME'
        channel: '#lap-pipeline'
        send_resolved: true
  - name: pagerduty
    pagerduty_configs:
      - routing_key: 'REPLACE_ME'
        severity: critical
