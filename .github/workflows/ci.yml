# CI/CD pipeline (Section 5.3): lint+unit -> contract -> build+scan -> integration -> deploy staging -> promote prod
name: ci
on:
  push: { branches: [ main ] }
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write          # keyless cosign signing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lap

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: mypy common stream detection alerting storage pipeline
      - name: unit tests + coverage gate (>= 75 % on core modules)
        run: |
          pip install pytest-cov
          pytest --deselect tests/test_end_to_end.py --cov --cov-report=term --cov-fail-under=75

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Avro schemas stay BACKWARD compatible
        run: python ingestion/schemas/check_compat.py
      - uses: azure/setup-helm@v4
      - name: helm lint + render
        run: |
          helm lint deploy/helm/lap -f deploy/helm/lap/values-staging.yaml
          helm template lap deploy/helm/lap -f deploy/helm/lap/values-prod.yaml > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate + plan
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  build-scan:
    needs: [ lint-test, contract ]
    runs-on: ubuntu-latest
    outputs: { digest: "${{ steps.build.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:staging
          build-args: WITH_TORCH=true
      - name: Trivy -- fail on critical CVEs
        uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: "${{ env.IMAGE }}:${{ github.sha }}", severity: CRITICAL, exit-code: "1", ignore-unfixed: true }
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with: { image: "${{ env.IMAGE }}:${{ github.sha }}", format: spdx-json, output-file: sbom.spdx.json }
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: cosign sign (verified by the cluster admission policy)
        if: github.event_name == 'push'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

  integration:
    needs: build-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt testcontainers[kafka,clickhouse]==4.8.1
      - name: end-to-end replay (lite stack) -- expected alerts produced, none spurious
        run: pytest tests/test_end_to_end.py -q
      - name: Kafka + ClickHouse via Testcontainers
        run: pytest tests/integration -q

  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: integration
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Argo CD Image Updater picks up ${{ env.IMAGE }}:staging; smoke tests + 15-min synthetic traffic gate on SLO dashboards"

  promote-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production      # requires manual approval by a second engineer
    steps:
      - uses: actions/checkout@v4
      - name: open PR bumping values-prod.yaml image tag
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git switch -c release/${{ github.sha }}
          sed -i "s/tag: \".*\"/tag: \"${{ github.sha }}\"/" deploy/helm/lap/values-prod.yaml
          git -c user.name=ci -c user.email=ci@example.com commit -am "release: ${{ github.sha }} to prod"
          git push origin HEAD
          gh pr create --title "Release ${{ github.sha }} to prod" --body "Automated rollback on SLO breach via Argo CD."
