# Fluent Bit DaemonSet configuration for Kubernetes (Section 4.1): tails container logs,
# adds Kubernetes metadata, batches, compresses with zstd and produces to Kafka over mTLS.
# Deployed by the umbrella chart (deploy/helm/lap) via the fluent-bit subchart values.
config:
  service: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server  On
        HTTP_Port    2020
        Health_Check On
        HC_Errors_Count 5
        HC_Retry_Failure_Count 5
        HC_Period    60
        storage.path /var/fluent-bit/state
        storage.backlog.mem_limit 64M
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*_kube-system_*.log,/var/log/containers/*_lap-system_*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     64MB
        Skip_Long_Lines   On
        storage.type      filesystem
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        Labels              On
        Annotations         Off
    # services that do not set "service" themselves get it from the app label
    [FILTER]
        Name    modify
        Match   kube.*
        Copy    $kubernetes['labels']['app.kubernetes.io/name'] service
  outputs: |
    [OUTPUT]
        Name                         kafka
        Match                        kube.*
        Brokers                      logs-cluster-kafka-bootstrap.kafka:9093
        Topics                       logs.raw
        Message_Key_Field            service
        Format                       json
        rdkafka.security.protocol    ssl
        rdkafka.ssl.ca.location      /certs/ca.crt
        rdkafka.ssl.certificate.location /certs/user.crt
        rdkafka.ssl.key.location     /certs/user.key
        rdkafka.compression.codec    zstd
        rdkafka.acks                 all
        rdkafka.enable.idempotence   true
        rdkafka.queue.buffering.max.ms 50
        storage.total_limit_size     2G
# liveness on the health endpoint restarts the shipper if its Kafka producer enters a fatal state
livenessProbe:
  httpGet: { path: /api/v1/health, port: 2020 }
  periodSeconds: 30
  failureThreshold: 3
