# Fluent Bit for the compose stack: receives container stdout via the Docker fluentd
# logging driver and ships it to Kafka logs.raw keyed by service.
[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Port     2020
    # /api/v1/health turns unhealthy after repeated output errors (e.g. a fatal idempotent producer)
    Health_Check  On
    HC_Errors_Count 5
    HC_Retry_Failure_Count 5
    HC_Period     60

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

# the container line is in "log"; lift JSON envelopes to the top level
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json_envelope
    Reserve_Data On
    Preserve_Key On

[OUTPUT]
    Name                      kafka
    Match                     *
    Brokers                   kafka:9092
    Topics                    logs.raw
    Message_Key_Field         service
    Format                    json
    Timestamp_Key             _fluent_ts
    rdkafka.compression.codec zstd
    rdkafka.acks              all
    rdkafka.enable.idempotence true
    rdkafka.queue.buffering.max.ms 20
