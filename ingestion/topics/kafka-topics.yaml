# Strimzi KafkaTopic resources (Appendix B). Applied by Argo CD with the platform chart.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: logs.raw
  labels: { strimzi.io/cluster: logs-cluster }
spec:
  partitions: 24
  replicas: 3
  config:
    retention.ms: 259200000        # 72 h
    min.insync.replicas: 2
    compression.type: zstd
    max.message.bytes: 1048576
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: logs.parsed
  labels: { strimzi.io/cluster: logs-cluster }
spec:
  partitions: 24
  replicas: 3
  config: { retention.ms: 259200000, min.insync.replicas: 2, compression.type: zstd }
---
